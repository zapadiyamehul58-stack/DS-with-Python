<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            display: flex;
            background: #f8fafc;
            min-height: 100vh;
            color: #1e293b;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 260px;
            background: #0f172a;
            color: #fff;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            transform: translateX(-100%);
            animation: slideInSidebar 0.5s forwards cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideInSidebar { to { transform: translateX(0); } }

        .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #3b82f6;
        }

        .menu-item {
            padding: 12px 15px;
            color: #94a3b8;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
            font-weight: 500;
        }

        .menu-item:hover, .menu-item.active {
            background: #1e293b;
            color: #fff;
            padding-left: 20px;
        }

        /* Main Workspace Content */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            animation: fadeIn 0.8s ease;
        }

        .logout-btn {
            padding: 8px 18px;
            background: #ef4444;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            transition: 0.3s;
        }
        .logout-btn:hover { background: #dc2626; }

        /* Stats Grid Layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
            animation: fadeIn 1s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
        }

        .card h3 {
            font-size: 14px;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .card .value {
            font-size: 28px;
            font-weight: 700;
            color: #0f172a;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">AppDash</div>
        <nav style="display: flex; flex-direction: column; gap: 10px;">
            <a href="#" class="menu-item active">Overview</a>
            <a href="#" class="menu-item">Analytics</a>
            <a href="#" class="menu-item">Settings</a>
        </nav>
    </div>

    <div class="main-content">
        <header>
            <h1>Welcome back, Admin!</h1>
            <a href="/" class="logout-btn">Logout</a>
        </header>

        <div class="grid">
            <div class="card" onclick="incrementCount('v1')">
                <h3>Total Users</h3>
                <div class="value" id="v1">1,248</div>
            </div>
            <div class="card" onclick="incrementCount('v2')">
                <h3>Active Sessions</h3>
                <div class="value" id="v2">84</div>
            </div>
            <div class="card" onclick="incrementCount('v3')">
                <h3>Server Load</h3>
                <div class="value" id="v3">12%</div>
            </div>
        </div>
    </div>

    <script>
        // Simple interactivity example to show CSS transitions on click
        function incrementCount(id) {
            const el = document.getElementById(id);
            let current = parseInt(el.innerText.replace(/,/g, ''));
            if(!isNaN(current)) {
                el.innerText = (current + 1).toLocaleString();
            }
        }
    </script>
</body>
</html>
